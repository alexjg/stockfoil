[workspace]
members = ["examples/mv-register", "javascript"]
default-members = [".", "examples/mv-register"]
resolver = "3"

[package]
name = "stockfoil"
version = "0.1.0"
edition = "2024"

[lib]

[features]
default = ["std"]
std = ["blake3/std", "ed25519-dalek/std"]

[dependencies]
bijoux = { version = "0.3.2", default-features = false, features = ["u64"] }
blake3 = { version = "1.8.7", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "fast", "zeroize"] }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"] }
once_cell = { version = "1.21", default-features = false, features = ["alloc", "race"] }

[dev-dependencies]
bcs = "0.2.1"
rand = "0.10.2"
serde = { version = "1", features = ["derive"] }

# Optimize dependencies (not workspace crates) in dev and test builds. Tests
# mine hashes and verify many signatures; unoptimized blake3 and ed25519 make
# them orders of magnitude slower. Our own crates stay fully debuggable.
[profile.dev.package."*"]
opt-level = 3
