[workspace]
members = ["examples/mv-register"]
resolver = "3"

[package]
name = "stockfoil"
version = "0.1.0"
edition = "2024"

[lib]

[dependencies]
bijoux = "0.3.2"
blake3 = "1.8.7"
ed25519-dalek = "2"
hexane = "=1.0.0-alpha.5"

[dev-dependencies]
blake3 = "1.8.7"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.10.2"

[[bench]]
name = "history"
harness = false
