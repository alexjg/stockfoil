[workspace]
members = ["examples/mv-register"]
default-members = [".", "examples/mv-register"]
resolver = "3"

[package]
name = "stockfoil"
version = "0.1.0"
edition = "2024"

[lib]

[dependencies]
bijoux = "0.3.2"
blake3 = "1.8.7"
ed25519-dalek = "2"
eyre = "0.6.14"

[dev-dependencies]
bcs = "0.2.1"
rand = "0.10.2"
serde = { version = "1", features = ["derive"] }
