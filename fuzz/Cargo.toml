[package]
name = "stockfoil-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone workspace: excluded from the main stockfoil workspace.
[workspace]
members = ["."]

[lib]
name = "stockfoil_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
stockfoil = { path = "../stockfoil" }
ed25519-dalek = "2"
blake3 = "1.8.7"

[[bin]]
name = "wire_header"
path = "fuzz_targets/wire_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "admission_bytes"
path = "fuzz_targets/admission_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "admission_replies"
path = "fuzz_targets/admission_replies.rs"
test = false
doc = false
bench = false

[[bin]]
name = "history_ops"
path = "fuzz_targets/history_ops.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
