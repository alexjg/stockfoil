[package]
name = "stockfoil-subduction"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-channel = "2"
future_form = "0.3"
futures = "0.3"
sedimentree_core = { version = "0.17.0", features = ["std"] }
stockfoil = { path = "../stockfoil" }
subduction_core = { version = "0.21.0", features = ["std"] }
subduction_crypto = { version = "0.12.0", features = ["std"] }
subduction_tokio = "0.1.0"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
blake3 = "1.8.7"
ed25519-dalek = "2"
subduction_core = { version = "0.21.0", features = ["std", "test_utils"] }
tokio = { version = "1", features = ["macros", "rt"] }
