[package]
name = "stockfoil-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stockfoil = { path = ".." }
wasm-bindgen = "=0.2.127"
js-sys = "0.3.104"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11"
